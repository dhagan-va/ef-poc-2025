networks:
  vanet:
    name: vanet

volumes:
  vadb:

services:
  vadb:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: vadb
    networks:
      - vanet
    logging:
      driver: "json-file"
      options:
        max-file: "2"
        max-size: "5m"
    volumes:
      - vadb:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -C -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-password_123}"
      MSSQL_PID: "${MSSQL_PID:-Developer}"

  db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    networks:
      - vanet
    depends_on:
      vadb:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-password_123}"
      PAYEREDI_APP_PASSWORD: "${PAYEREDI_APP_PASSWORD:-payeredi_app_password}"
    volumes:
      - ./database:/scripts:ro,Z
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -S
      - vadb
      - -C
      - -U
      - sa
      - -P
      - "${MSSQL_SA_PASSWORD:-password_123}"
      - -v
      - "PAYEREDI_APP_PASSWORD=${PAYEREDI_APP_PASSWORD:-payeredi_app_password}"
      - -i
      - /scripts/bootstrap.sql
      - -b

  motoserver:
    image: docker.io/motoserver/moto:5.2.3
    container_name: motoserver
    networks:
      - vanet
    logging:
      driver: "json-file"
      options:
        max-file: "2"
        max-size: "5m"
    ports:
      - "3000:3000"
    environment:
      MOTO_PORT: "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 3000), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
